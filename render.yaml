services:
  - type: web
    name: student-performance-prediction
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt && python backend/train_model.py
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
